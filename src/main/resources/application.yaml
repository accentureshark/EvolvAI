server:
  port: 8081

# Configuración de embeddings
# Configuración de embeddings
embedding:
  chunking:
    size: 500
    overlap: 100
  storage:
    type: pgVector  # Opciones: inMemory, pgVector
  generator:
    type: onnx    # Opciones: onnx, ollama
  pgvector:
    host: localhost
    port: 5432
    database: evolvai
    user: postgres
    password: postgres1234
    tableName: embedding.embeddings
    dimensions: 2000
  onnx:
    model-path: ./models/all-MiniLM-L6-v2.onnx
  ollama:
    base-url: http://localhost:11434
    model: llama3:8b  # también podés probar nomic-embed-text, llama3:8b si soporta embeddings
  tokenizer:
    path: classpath:tokenizer/tokenizer.json

inference:
  max-results: 3
  min-score: 0.85


# Configuración del LLM
llm:
  provider: "ollama"
  default-prompt: 'Respondé exclusivamente usando el contexto provisto. 
  Si no hay información relevante en el contexto, decí ''No se encontró información suficiente''.'
  llama:
    base-url: "http://localhost:8000/v1"
    api-key: "test_api_key"
    model: "llama2"
    temperature: 0.7
    max-tokens: 512
    top-p: 0.95
    top-k: 50
  ollama:
    base-url: "http://localhost:11434"
    model: "phi3:mini"
    temperature: 0.2
    timeout-sec: 180

  #ollama:
  #  base-url: "http://localhost:11434"
  #  model: "phi3:mini"
  #  temperature: 0.2
  #  timeout-sec: 180


# Configuración de persistencia de chat memory
chatmemory-persistence:
  provider: "jpa"
  memory:
    file-path: "./chat-memory.db"
  jpa:
    table-name: "chat_memory"

# Configuración de Spring
spring:
  application:
    name: evolvAI
  profiles:
    active: default
  main:
    allow-bean-definition-overriding: true
  datasource:
    url: jdbc:postgresql://localhost:5432/evolvai
    driver-class-name: org.postgresql.Driver
    username: postgres
    password: postgres1234
  jpa:
    show-sql: true
    hibernate:
      ddl-auto: update
    database-platform: org.hibernate.dialect.PostgreSQLDialect
    properties:
      hibernate:
        format_sql: true
        use_sql_comments: true  # (opcional) agrega comentarios a los SQL generados

# Docker compose
---
services:
  pgvector:
    image: "pgvector/pgvector:pg17"
    environment:
      POSTGRES_USER: "postgres"
      POSTGRES_PASSWORD: "postgres1234"
      POSTGRES_DB: "evolvai"
    ports:
      - "5432:5432"
    volumes:
      - pgvector-data:/var/lib/postgresql/data
      - ./init_pgvector.sql:/docker-entrypoint-initdb.d/init_pgvector.sql

volumes:
  pgvector-data:


# Logging detallado
logging:
  level:
    root: INFO
    org.shark.evolvai: DEBUG
    org.springframework.web: DEBUG
    org.springdoc: DEBUG
    org.hibernate.SQL: INFO              # muestra las sentencias SQL
    org.hibernate.type.descriptor.sql: INFO  # muestra los parámetros enlazados
    org.hibernate.orm.jdbc.bind: INFO   # más trazas de bindings
    org.hibernate.engine.jdbc.spi: INFO  # detalles de conexión JDBC y ejecución

# Configuración de Springdoc
springdoc:
  api-docs:
    enabled: true
  swagger-ui:
    enabled: true

management:
  endpoints:
    web:
      exposure:
        include: health,info,rag