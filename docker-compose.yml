version: '3.8'

services:
  pgvector:
    image: ankane/pgvector
    container_name: pgvector
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres1234
      POSTGRES_DB: vectors
    volumes:
      - pgvector_data:/var/lib/postgresql/data
      - ./init_pgvector.sql:/docker-entrypoint-initdb.d/init_pgvector.sql

  localai:    # Esta línea necesitaba estar indentada dentro de 'services'
    image: quay.io/go-skynet/local-ai:latest
    container_name: localai
    ports:
      - "8000:8080"
    environment:
      - MODELS_PATH=/models
    volumes:
      - ./src/main/resources/model:/models
    command: ["/bin/local-ai", "--threads", "4", "--context-size", "1024"]
    restart: unless-stopped

volumes:
  pgvector_data: