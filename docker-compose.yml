
services:

  ollama:
    build:
      context: .
      dockerfile: Dockerfile.ollama
    ports:
      - "11434:11434"
    environment:
      - OLLAMA_MODELS=phi3:mini
      - OLLAMA_DEBUG=INFO
      - OLLAMA_LLM_LIBRARY=cpu
    volumes:
      - ollama-data:/root/.ollama
    healthcheck:
      test: [ "CMD", "wget", "-qO-", "http://localhost:11434" ]
      interval: 15s
      timeout: 10s
      retries: 10

  pgvector:
    image: docker.io/ankane/pgvector
    container_name: evolvai_pgvector
    restart: always
    environment:
      POSTGRES_DB: evolvai
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres1234
      PGDATA: /var/lib/postgresql/data/pgdata
    ports:
      - "5432:5432"
    volumes:
      - ./rag/src/main/sql/initdb:/docker-entrypoint-initdb.d
    depends_on:
      - ollama
    healthcheck:
      test: [ "CMD", "pg_isready", "-U", "postgres" ]
      interval: 5s
      timeout: 5s
      retries: 10

  maven-cache:
    image: maven:3.9-eclipse-temurin-17-alpine
    volumes:
      - maven-repo:/root/.m2
    command: tail -f /dev/null

  webapp:
    image: nginx:alpine
    container_name: evolvai_web
    ports:
      - "8080:80"
    volumes:
      - ./webapp/static:/usr/share/nginx/html:ro
    depends_on:
      - pgvector

  backend:
    build:
      context: .
      dockerfile: Dockerfile.backend
    container_name: evolvai_backend
    volumes:
      - maven-repo:/root/.m2
    ports:
      - "8081:8081"
    environment:
      - SPRING_PROFILES_ACTIVE=docker
    depends_on:
      - webapp

volumes:
  ollama-data:
  pgvector-data:
  maven-repo: