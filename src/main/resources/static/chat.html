<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Chat EvolvAI</title>
  <link rel="stylesheet" href="chat.css">
</head>
<body>
  <div id="main-container">
    <header id="main-header">
      <img src="shark-ia.png" alt="Logo" id="header-logo">
      <span id="header-title">EvolvAI Chat</span>
    </header>
    <div id="chat">
      <div id="sidebar-left">
        <div class="sidebar-pane" id="sidebar-memory"><h4>Memoria</h4><p>Memoria activa o contexto.</p></div>
        <div class="sidebar-pane" id="sidebar-history"><h4>Historial</h4><ul><li>Consulta 1</li></ul></div>
      </div>
      <div id="chat-area">
        <div id="messages"></div>
        <div id="scroll-anchor"></div>
        <form id="input-area">
          <div class="input-options"><input id="advanced-check" type="checkbox"><label for="advanced-check">Avanzado</label></div>
          <div class="input-row">
            <input autocomplete="off" id="user-input" placeholder="Escribe tu mensaje..." type="text"/>
            <label for="file-input" id="file-label" title="Subir archivo (.txt o .pdf)">📎</label>
            <input accept=".txt,.pdf" id="file-input" type="file" />
            <button type="submit" id="send-btn">➤</button>
          </div>
        </form>
      </div>
      <div id="sidebar-right">
        <div class="sidebar-pane" id="sidebar-files"><h4>Archivos subidos</h4><ul id="file-list"></ul></div>
        <div class="sidebar-pane" id="sidebar-prompt"><h4>Prompt personalizado</h4><textarea id="custom-prompt" placeholder="Prompt aquí..."></textarea></div>
      </div>
    </div>

    <div id="log-panel"><div id="log-header" onclick="toggleLog()"><span>🪵 Log</span><button id="log-toggle">▼</button></div><div id="log-entries">🖥️ Consola iniciada...</div></div>
  </div>
  <script src="chat.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/sockjs-client@1/dist/sockjs.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/stompjs@2.3.3/lib/stomp.min.js"></script>

</body>
</html>
