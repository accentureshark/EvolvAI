server:
  port: 8081


rag:
  embedding:
    chunking:
      size: 20        # ajustable: 20-50 es ideal para frases tipo ítems
      overlap: 5      # para dar contexto si hay más de un chunk
    storage:
      type: pgVector  # Opciones: inMemory, pgVector
    generator:
      provider: ollama
      model: ${OLLAMA_EMBEDDING_MODEL}
    pgvector:
      host: localhost
      port: 5432
      database: evolvai
      user: postgres
      password: postgres1234
      tableName: embedding.embeddings
      dimensions: 1024 # Asegúrate de que coincida con el modelo de embeddings
    ollama:
      base-url: http://localhost:11434 #localhost fuera de dockercompose
      model: ${OLLAMA_EMBEDDING_MODEL}  # Más específico y liviano para embeddings
    tokenizer:
      path: classpath:tokenizer/tokenizer.json
      generator:
        provider: ollama

  llm:
    provider: "ollama"
    prompt: |
      Respondé **solo** utilizando los fragmentos del contexto provisto abajo.
      Si no encontrás una respuesta literal en el contexto, respondé exactamente: "No hay información suficiente en los documentos".
      No agregues información, opiniones, ni expandas las ideas. NO inventes ni completes por tu cuenta.
      Usá únicamente frases textuales del contexto. Si es necesario, copiá textualmente los fragmentos relevantes.

      [CONSULTA DEL USUARIO]
      {query}

      [CONTEXT RELEVANTE]
      {context}

    ollama:
      base-url: "http://localhost:11434"
      model: ${OLLAMA_LLM_MODEL}
      temperature: 0.2
      timeout-sec: 180

  inference:
    max-results: 5
    min-score: 0.7
  metadata:
    enrich-with:
      - nivel
      - area
      - documentId


chatmemory-persistence:
  provider: "jpa"
  memory:
    file-path: "./chat-memory.db"
  jpa:
    table-name: "chat_memory"

spring:
  application:
    name: evolvAI
  profiles:
    active: default
  main:
    allow-bean-definition-overriding: true
  datasource:
    url: jdbc:postgresql://localhost:5432/evolvai
    driver-class-name: org.postgresql.Driver
    username: postgres
    password: postgres1234
  jpa:
    show-sql: true
    hibernate:
      ddl-auto: update
    database-platform: org.hibernate.dialect.PostgreSQLDialect
    properties:
      hibernate:
        format_sql: true
        use_sql_comments: true

# Docker compose (usado por referencia)
---
services:
  pgvector:
    image: "pgvector/pgvector:pg17"
    environment:
      POSTGRES_USER: "postgres"
      POSTGRES_PASSWORD: "postgres1234"
      POSTGRES_DB: "evolvai"
    ports:
      - "5432:5432"
    volumes:
      - pgvector-data:/var/lib/postgresql/data
      - ./init_pgvector.sql:/docker-entrypoint-initdb.d/init_pgvector.sql

volumes:
  pgvector-data:


# Logging detallado
logging:
  level:
    root: INFO
    org.shark.evolvai: INFO
    org.springframework.web: INFO
    org.springdoc: DEBUG
    io.swagger.v3: DEBUG
    org.hibernate.SQL: INFO
    org.hibernate.type.descriptor.sql: INFO
    org.hibernate.orm.jdbc.bind: INFO
    org.hibernate.engine.jdbc.spi: INFO

# Configuración de Springdoc
springdoc:
  api-docs:
    enabled: true
  swagger-ui:
    enabled: true

management:
  endpoints:
    web:
      exposure:
        include: "*"
  cors:
    allowed-origins: "*"
    allowed-methods: "*"
    allowed-headers: "*"
