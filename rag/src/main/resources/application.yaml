server:
  port: 8081


rag:
  embedding:
    chunking:
      size: 1000       # ajustable: 20-50 es ideal para frases tipo ítems
      overlap: 50      # para dar contexto si hay más de un chunk
    storage:
      type: pgVector  # Opciones: inMemory, pgVector
    generator:
      provider: ollama
      model: ${OLLAMA_EMBEDDING_MODEL}
    pgvector:
      host: localhost
      port: 5432
      database: evolvai
      user: postgres
      password: postgres1234
      tableName: embedding.embeddings
      dimensions: 1024 # Asegúrate de que coincida con el modelo de embeddings
    ollama:
      base-url: http://localhost:11434 #localhost fuera de dockercompose
      model: ${OLLAMA_EMBEDDING_MODEL}  # Más específico y liviano para embeddings
    tokenizer:
      path: classpath:tokenizer/tokenizer.json
      generator:
        provider: ollama

  llm:
    provider: "ollama"
    prompt: |
      Eres un asistente en español entrenado para responder **solo** con información extraída de los fragmentos de texto que recibes como contexto. Tu objetivo es ofrecer respuestas **muy breves y precisas** al usuario, manteniendo siempre fidelidad al texto original.

      1. **Selección estricta de fragmentos**

        - Elige únicamente los fragmentos **directamente relevantes** a la pregunta.
        - Descarta cualquier fragmento que no aporte información nueva o esencial.

      2. **Límite de longitud**

        - Tu respuesta **no debe superar** los 500 caracteres.
        - Ofrece un **resumen condensado** que recoja los puntos clave sin perder precisión.

      3. **Síntesis y paráfrasis fiel**

        - Si hay varios fragmentos que aportan la misma idea, combina sus contenidos en una única respuesta coherente y breve.
        - Puedes reformular para mayor claridad, pero sin alterar el contenido.
        - No introduzcas juicios, opiniones ni información externa.

      4. **Formato de salida**

        - Usa listas, **negritas** o _cursivas_ para organizar y resaltar la información importante.
        - Presenta los fragmentos o resúmenes de forma natural, clara y legible, respetando la sintaxis Markdown.

      5. **Fallback (respuesta por defecto)**

        - Si tras revisar todo el contexto **no** encuentras ningún fragmento relevante, devuelve **exactamente** esta frase, sin añadidos:

        ```
        No hay información suficiente en el documento.
        ```

      [CONTEXTO]
      {context}

      [MENSAJE DEL USUARIO]
      {query}
    ollama:
      base-url: "http://localhost:11434"
      model: ${OLLAMA_LLM_MODEL}
      timeout-sec: 180

  inference:
    max-results: 10
    min-score: 0.75
  metadata:
    enrich-with:
      - nivel
      - area
      - documentId


chatmemory-persistence:
  provider: "jpa"
  memory:
    file-path: "./chat-memory.db"
  jpa:
    table-name: "chat_memory"

spring:
  application:
    name: evolvAI
  profiles:
    active: default
  main:
    allow-bean-definition-overriding: true
  datasource:
    url: jdbc:postgresql://localhost:5432/evolvai
    driver-class-name: org.postgresql.Driver
    username: postgres
    password: postgres1234
  jpa:
    show-sql: true
    hibernate:
      ddl-auto: update
    database-platform: org.hibernate.dialect.PostgreSQLDialect
    properties:
      hibernate:
        format_sql: true
        use_sql_comments: true

# Docker compose (usado por referencia)
---
services:
  pgvector:
    image: "pgvector/pgvector:pg17"
    environment:
      POSTGRES_USER: "postgres"
      POSTGRES_PASSWORD: "postgres1234"
      POSTGRES_DB: "evolvai"
    ports:
      - "5432:5432"
    volumes:
      - pgvector-data:/var/lib/postgresql/data
      - ./init_pgvector.sql:/docker-entrypoint-initdb.d/init_pgvector.sql

volumes:
  pgvector-data:


# Logging detallado
logging:
  level:
    root: INFO
    org.shark.evolvai: INFO
    org.springframework.web: INFO
    org.springdoc: DEBUG
    io.swagger.v3: DEBUG
    org.hibernate.SQL: INFO
    org.hibernate.type.descriptor.sql: INFO
    org.hibernate.orm.jdbc.bind: INFO
    org.hibernate.engine.jdbc.spi: INFO

# Configuración de Springdoc
springdoc:
  api-docs:
    enabled: true
  swagger-ui:
    enabled: true

management:
  endpoints:
    web:
      exposure:
        include: "*"
  cors:
    allowed-origins: "*"
    allowed-methods: "*"
    allowed-headers: "*"

# MCP (Model Control Protocol) Configuration
mcp:
  enabled: true
  server-url: "http://localhost:8080"
  connection-timeout: 30000
  read-timeout: 60000
  auth:
    api-key: "${MCP_API_KEY:}"
    username: "${MCP_USERNAME:}"
    password: "${MCP_PASSWORD:}"
