server:
  port: 8081

rag:
  embedding:
    chunking:
      size: 20        # ajustable: 20-50 es ideal para frases tipo ítems
      overlap: 5      # para dar contexto si hay más de un chunk
    storage:
      type: pgVector  # Opciones: inMemory, pgVector
    generator:
      provider: ollama
      model: bge-large-en
    pgvector:
      host: pgvector
      port: 5432
      database: evolvai
      user: postgres
      password: postgres1234
      tableName: embedding.embeddings
      dimensions: 1024 # Asegúrate de que coincida con el modelo de embeddings
    ollama:
      base-url: http://ollama:11434
      model: nomic-embed-text  # Más específico y liviano para embeddings
    tokenizer:
      path: classpath:tokenizer/tokenizer.json
      generator:
        provider: ollama

  llm:
    provider: "ollama"
    prompt: |
      Eres un asistente experto que responde únicamente con información extraída de documentos provistos.      
      Sigue estas reglas estrictamente:      
      1. Si la respuesta NO está explícitamente en los documentos, responde exactamente: "No hay información suficiente en los documentos".
      2. No agregues opiniones, explicaciones, inferencias ni información que no esté textual en el contexto.
      3. Responde SOLO con frases literales copiadas textualmente de los fragmentos relevantes.
      4. Si la pregunta no tiene respuesta clara en el contexto, di la frase exacta mencionada en el punto 1.
      5. No completes ni inventes nada.
      
      Aquí está la pregunta del usuario:
      [CONSULTA DEL USUARIO]
      {query}
      
      Aquí está el contexto disponible, formado por fragmentos extraídos de documentos:
      [CONTEXT RELEVANTE]
      {context}
      
      proporciona una respuesta clara y precisa usando solo el contexto.
    ollama:
      base-url: "http://ollama:11434"
      model: "phi3:mini"
      temperature: 0.2
      timeout-sec: 180
    llama:
      base-url: "http://localhost:8000/v1"
      api-key: "test_api_key"
      model: "llama2"
      temperature: 0.7
      max-tokens: 512
      top-p: 0.95
      top-k: 50
  inference:
    max-results: 5
    min-score: 0.7
  metadata:
    enrich-with:
      - nivel
      - area
      - documentId


chatmemory-persistence:
  provider: "jpa"
  memory:
    file-path: "./chat-memory.db"
  jpa:
    table-name: "chat_memory"

spring:
  application:
    name: evolvAI
  main:
    allow-bean-definition-overriding: true
  datasource:
    url: jdbc:postgresql://pgvector:5432/evolvai
    driver-class-name: org.postgresql.Driver
    username: postgres
    password: postgres1234
  jpa:
    show-sql: true
    hibernate:
      ddl-auto: update
    database-platform: org.hibernate.dialect.PostgreSQLDialect
    properties:
      hibernate:
        format_sql: true
        use_sql_comments: true

# Docker compose (usado por referencia)
---
services:
  pgvector:
    image: "pgvector/pgvector:pg17"
    environment:
      POSTGRES_USER: "postgres"
      POSTGRES_PASSWORD: "postgres1234"
      POSTGRES_DB: "evolvai"
    ports:
      - "5432:5432"
    volumes:
      - pgvector-data:/var/lib/postgresql/data
      - ./init_pgvector.sql:/docker-entrypoint-initdb.d/init_pgvector.sql

volumes:
  pgvector-data:


# Logging detallado
logging:
  level:
    root: INFO
    org.shark.evolvai: INFO
    org.springframework.web: INFO
    org.springdoc: DEBUG
    io.swagger.v3: DEBUG
    org.hibernate.SQL: INFO
    org.hibernate.type.descriptor.sql: INFO
    org.hibernate.orm.jdbc.bind: INFO
    org.hibernate.engine.jdbc.spi: INFO
    io.micrometer: INFO
    org.springframework.boot.actuate: INFO



management:
  endpoints:
    web:
      exposure:
        include: "health,info,metrics,prometheus"  # Habilita endpoints clave
  endpoint:
    prometheus:
      enabled: true
  metrics:
    export:
      dynatrace:
        enabled: true
        api-token: dummy-token   # Poné cualquier string para testeo
        uri: http://localhost:14499/api/v2/metrics/ingest # O el que tengas apuntando a WireMock o Dynatrace
        device-id: evolvai-dev
        technology-type: spring-boot
      prometheus:
        enabled: true

