server:
  port: 8081
# Configuración de embeddings
embedding:
  storage:
    type: pgVector  # Opciones: inMemory, pgVector
  generator:
    type: onnx      # Opciones: onnx, [otros a futuro]
  pgvector:
    host: localhost
    port: 5432
    database: vectors
    user: postgres
    password: postgres1234
    tableName: embeddings
    dimensions: 1536
  onnx:
    model-path: ./models/all-MiniLM-L6-v2.onnx

# Configuración del LLM
llm:
  provider: "llama"
  llama:
    base-url: "http://localhost:8000/v1"
    api-key: "tu_api_key_opcional"
    model: "llama-2-7b-chat"
    model-path: "classpath:model/ggml-model.gguf"
# Configuración de persistencia de chat memory
# Configuración de persistencia de chat memory
chatmemory-persistence:
  provider: "jpa"
  memory:
    file-path: "./chat-memory.db"  # Ruta personalizable para el archivo MapDB
  jpa:
    table-name: "chat_memory"      # Nombre de tabla personalizable
# Configuración de Spring
spring:
  profiles:
    active: default
  main:
    allow-bean-definition-overriding: true
  # Configuración de base de datos necesaria para los tests
  datasource:
    url: jdbc:postgresql://localhost:5432/vectors
    driver-class-name: org.postgresql.Driver
    username: postgres
    password: postgres1234
  jpa:
    hibernate:
      ddl-auto: update
    database-platform: org.hibernate.dialect.PostgreSQLDialect
    properties:
      hibernate:
        format_sql: true

# Docker compose (debería estar en un archivo separado)
# Usar --- para separar documentos YAML
---
services:
  pgvector:
    image: "pgvector/pgvector:pg17"
    environment:
      POSTGRES_USER: "postgres"
      POSTGRES_PASSWORD: "postgres1234"
      POSTGRES_DB: "vectors"
    ports:
      - "5432:5432"
    volumes:
      - pgvector-data:/var/lib/postgresql/data
      - ./init_pgvector.sql:/docker-entrypoint-initdb.d/init_pgvector.sql

volumes:
  pgvector-data: