server:
  port: 8081

# Configuración de embeddings
embedding:
  storage:
    type: pgVector  # Opciones: inMemory, pgVector
  generator:
    type: onnx      # Opciones: onnx, [otros a futuro]
  pgvector:
    host: localhost
    port: 5432
    database: evolvai
    user: postgres
    password: postgres1234
    tableName: embeddings
    dimensions: 1536
  onnx:
    model-path: ./models/all-MiniLM-L6-v2.onnx

# Configuración del LLM
llm:
  provider: "llama"
  llama:
    base-url: "http://localhost:8000/v1"
    api-key: "tu_api_key_opcional"
    model: "llama-2-7b-chat"
    model-path: "classpath:model/ggml-model.gguf"

# Configuración de persistencia de chat memory
chatmemory-persistence:
  provider: "jpa"
  memory:
    file-path: "./chat-memory.db"
  jpa:
    table-name: "chat_memory"

# Configuración de Spring
spring:
  profiles:
    active: default
  main:
    allow-bean-definition-overriding: true
  datasource:
    url: jdbc:postgresql://localhost:5432/evolvai
    driver-class-name: org.postgresql.Driver
    username: postgres
    password: postgres1234
  jpa:
    show-sql: true
    hibernate:
      ddl-auto: update
    database-platform: org.hibernate.dialect.PostgreSQLDialect
    properties:
      hibernate:
        format_sql: true
        use_sql_comments: true  # (opcional) agrega comentarios a los SQL generados

# Logging detallado
logging:
  level:
    root: DEBUG
    org.springframework.web: DEBUG
    org.springdoc: DEBUG
    org.hibernate.SQL: DEBUG              # muestra las sentencias SQL
    org.hibernate.type.descriptor.sql: TRACE  # muestra los parámetros enlazados
    org.hibernate.orm.jdbc.bind: TRACE    # más trazas de bindings
    org.hibernate.engine.jdbc.spi: DEBUG  # detalles de conexión JDBC y ejecución

# Configuración de Springdoc
springdoc:
  api-docs:
    enabled: true
  swagger-ui:
    enabled: true

# Docker compose
---
services:
  pgvector:
    image: "pgvector/pgvector:pg17"
    environment:
      POSTGRES_USER: "postgres"
      POSTGRES_PASSWORD: "postgres1234"
      POSTGRES_DB: "evolvai"
    ports:
      - "5432:5432"
    volumes:
      - pgvector-data:/var/lib/postgresql/data
      - ./init_pgvector.sql:/docker-entrypoint-initdb.d/init_pgvector.sql

volumes:
  pgvector-data:
